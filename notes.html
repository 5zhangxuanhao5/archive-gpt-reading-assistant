<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笔记</title><link rel="stylesheet" href="vendor/katex.min.css"><link rel="stylesheet" href="notes.css"></head>
<body>
  <div class="toolbar"><button id="toggle-tree" aria-expanded="false" aria-controls="library" title="浏览笔记和文件夹">笔记 ▾</button><button id="new-note" title="新建笔记">＋ 新建</button><button id="new-folder" title="新建文件夹" aria-label="新建文件夹"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2-3h9v16H3zM14 12v5m-2.5-2.5h5"/></svg></button><button id="export-note" title="导出当前笔记为 Markdown" aria-label="导出当前笔记为 Markdown">导出</button><span id="vault-label"></span><button id="settings" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></button><button id="close-panel" title="关闭笔记面板" aria-label="关闭笔记面板" hidden>×</button></div>
  <section id="setup-card" hidden><p>选择笔记文件夹，之后自动保存在电脑里。</p><button id="setup" class="primary">选择文件夹</button><button id="later">稍后</button></section>
  <section class="library" id="library" hidden><input type="search" id="search" placeholder="搜索笔记" aria-label="搜索笔记"><div id="tree" class="tree" aria-label="文件夹和笔记"></div></section>
  <div id="tabs" class="tabs" role="tablist" aria-label="打开的笔记"></div>
  <main class="editor-area"><div id="welcome"><button id="welcome-new" class="primary">新建笔记</button></div><section id="document" hidden><span id="note-title" hidden></span><span id="breadcrumb" hidden></span><div class="format-row mode-row"><div class="format-tools"><button id="rename" title="重命名或移动笔记" aria-label="重命名或移动笔记"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 12-12 4 4L8 20H4zM14 6l4 4"/></svg></button><button data-format="bold" title="粗体"><b>B</b></button><button data-format="italic" title="斜体"><i>I</i></button><button data-format="underline" title="下划线"><u>U</u></button><button data-format="strike" title="删除线"><s>S</s></button><span class="format-divider"></span><button data-format="heading" title="标题">标题</button><details id="format-more"><summary aria-label="更多格式">⋯</summary><div class="format-menu"><button data-format="quote">引用</button><button data-format="bullet">项目列表</button><button data-format="link">链接</button><button data-format="image">图片链接</button><button data-format="ordered">编号列表</button><button data-format="task">待办事项</button><button data-format="code">行内代码</button><button data-format="fence">代码块</button><button data-format="table">表格</button><button data-format="math">数学公式</button><button data-format="rule">分隔线</button></div></details></div><div id="preview-filters" aria-label="预览内容筛选" hidden><label title="显示文字框"><input type="checkbox" data-filter="text" checked><span class="filter-dot" data-kind="text"></span><span>文字</span></label><label title="显示图片框"><input type="checkbox" data-filter="image" checked><span class="filter-dot" data-kind="image"></span><span>图片</span></label><label title="显示 GPT 引用框"><input type="checkbox" data-filter="quote" checked><span class="filter-dot" data-kind="quote"></span><span>引用</span></label></div><div class="mode-tools"><button id="edit-mode" class="active">编辑</button><button id="preview-mode">预览</button></div></div><div id="block-editor" aria-label="分块笔记编辑器"></div><div id="preview-surface" hidden><div id="markdown-preview" class="markdown-body"></div></div></section></main><section id="answer-outline-page" hidden><div class="answer-outline-head"><strong>目录</strong><button id="outline-back-notes" title="回到笔记">笔记</button></div><div id="outline-levels" aria-label="目录层级"></div><p id="outline-answer-title"></p><nav id="answer-headings" aria-label="当前回答的目录"></nav></section>
  <footer><span id="save-status" role="status">正在打开笔记库…</span><span id="count"></span></footer>
  <div id="notice" role="status" hidden></div>
  <dialog id="name-dialog"><form method="dialog" id="name-form"><h2 id="dialog-title">新建笔记</h2><label>名称<input id="name-input" required maxlength="100" autocomplete="off"></label><label>文件夹<select id="folder-select"></select></label><p id="dialog-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" value="cancel" formnovalidate>取消</button><button id="dialog-submit" value="ok" class="primary">确定</button></div></form></dialog>
  <dialog id="settings-dialog"><h2>设置</h2><label class="check"><input id="auto-return" type="checkbox">追问后自动返回本聊天定位</label><div class="setting-group"><strong id="folder-status"></strong><button id="authorize">更改笔记文件夹</button><button id="sync">重新保存到电脑</button><button id="refresh">读取文件夹更新</button><button id="export">导出备份</button></div><div class="setting-group block-color-settings"><strong>默认框颜色</strong><label>文字<input type="color" data-type-color="text" aria-label="文字框默认颜色" value="#f3f6fc"></label><label>图片<input type="color" data-type-color="image" aria-label="图片框默认颜色" value="#fff5e8"></label><label>GPT 引用<input type="color" data-type-color="quote" aria-label="GPT 引用框默认颜色" value="#f1edfb"></label></div><button id="settings-close" class="primary">完成</button></dialog>
  <script type="module" src="notes.js"></script>
</body></html>
