<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存方式</title><link rel="stylesheet" href="notes.css"><link rel="stylesheet" href="setup.css"></head><body>
<main class="setup-page"><h1>已自动保存在此浏览器</h1><p class="intro">加载插件即可开始使用，无需安装任何本地组件。</p><section class="setup-form"><p>笔记、图片和阅读位置会在浏览器重启后保留。卸载扩展、清理扩展数据或更换浏览器前，请在笔记设置中导出完整备份。</p><p>Chrome 和 Edge 分别保存数据，可用完整备份导入另一浏览器。同一浏览器的多个聊天可以共用笔记。</p><h2>可选：另存到文件夹</h2><p>选择后会把 Markdown 和图片同时保存到所选文件夹。浏览器可能在重启后要求重新授权；未授权时仍自动保存在此浏览器。</p><button id="browser-choose">绑定笔记文件夹</button><div id="existing" hidden><strong id="existing-name"></strong><button id="reconnect" hidden>重新授权文件夹</button></div><p id="result" role="status"></p></section><p class="hint">无需绑定文件夹也能正常使用，直接回到聊天即可。</p></main><script type="module" src="setup.js"></script></body></html>
