<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置笔记文件夹</title><link rel="stylesheet" href="notes.css"><link rel="stylesheet" href="setup.css"></head><body>
<main class="setup-page"><h1>笔记文件夹</h1><p class="intro">选择一次，之后自动保存。</p><section class="setup-form"><button id="choose" class="primary" disabled>选择笔记文件夹</button><p class="hint">直接选择要使用的文件夹。需要新建时，可在系统选择窗口里自行创建。</p><div id="existing" hidden><strong id="existing-name"></strong><button id="reconnect" hidden>连接已有文件夹</button></div><p id="result" role="status"></p><details id="fallback" hidden><summary>其他保存方式</summary><p class="hint">未安装本地文件组件时，也可使用浏览器文件夹接口。浏览器可能要求再次授权；为持续保存，请安装插件文件夹 native 内的本地文件组件。</p><button id="browser-choose">使用浏览器选择文件夹</button></details></section><p class="hint">完成后可以关闭此页，回到聊天继续记笔记。</p></main><script type="module" src="setup.js"></script></body></html>
